name: Flutter prototype (F0 debug APK)

# Phase F0 of docs/flutter-migration-plan.md. Builds the Flutter prototype in flutter/ and attaches debug APKs
# (one per phone type) to the run as an artifact: open the run, download "flutter-f0-apks", install on your phone.
# Debug-signed, for trying only. The Expo build and its workflows are untouched.

on:
  push:
    branches: [dev]
    paths: ['flutter/**', '.github/workflows/flutter-apk.yml']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-f0-apks
          path: flutter/build/app/outputs/flutter-apk/*.apk
